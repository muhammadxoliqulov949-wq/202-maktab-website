name: Verify Supabase (Phase 3)

# Qo'lda ishga tushiriladi: Actions → Verify Supabase → Run workflow
# Talab: repo secret'larida SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY
# va Supabase'da migratsiyalar + seed qo'llanilgan bo'lsin.

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build
        env:
          # build vaqti DB'ga ulanmaydi; env validatsiyasi uchun yetarli
          DATA_PROVIDER: supabase
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Verify (real Supabase DB)
        run: node scripts/verify-supabase.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
